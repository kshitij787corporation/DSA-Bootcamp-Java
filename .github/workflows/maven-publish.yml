
# Build and publish a Maven package to GitHub Packages when a release is created

name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build, test, and publish with Maven
        run: mvn -B deploy -s "$GITHUB_WORKSPACE/settings.xml" --file pom.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
